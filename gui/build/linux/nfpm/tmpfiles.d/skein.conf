# Skein mesh VPN — runtime directory (Step 11, closes Agent C L-01).
# /run/skein must exist (0750 root:skein) before the daemon creates
# control.sock in it. The unit also sets RuntimeDirectory=skein, so
# this entry is belt-and-braces for any start path that bypasses the
# unit (e.g. a manual `skeind run` as a service debug).
# Format: https://www.freedesktop.org/software/systemd/man/tmpfiles.d.html
d /run/skein 0750 root skein -

# Skein mesh VPN — system group (Step 11, closes Agent C L-01).
# The daemon runs as root; the group exists only for socket access:
# the control socket /run/skein/control.sock is 0660 root:skein, and
# grants in /etc/skein/access name uids, not the group. Until this
# group exists, the socket's group grant is dead.
# No user is created: the daemon never runs unprivileged.
# Format: https://www.freedesktop.org/software/systemd/man/sysusers.d.html
g skein -

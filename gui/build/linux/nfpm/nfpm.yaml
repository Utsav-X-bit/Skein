# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "skein-desktop"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Skein mesh VPN desktop"
vendor: "Skein"
homepage: "https://wails.io"
license: "MIT"
release: "1"

contents:
  - src: "./bin/skein-desktop"
    dst: "/usr/local/bin/skein-desktop"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/skein-desktop.png"
  - src: "./build/linux/skein-desktop.desktop"
    dst: "/usr/share/applications/skein-desktop.desktop"
  # Step 11 (ADR-001 collapse): the package ships the whole system
  # side, not just the desktop. Paths are relative to gui/ (the dir
  # wails3 tool package runs from); the binaries are built by the
  # build:system-binaries task before create:deb/rpm/aur. The
  # content assertions in scripts/packaging-assert.sh fail the build
  # if any of these entries is removed — the old failure mode
  # (shipping only the desktop exe) must not pass silently.
  # Daemon: the service binary. RegisterDaemon (Step 6) registers
  # exactly this path; upgrades replace this file, so no unit
  # rewrite is needed to adopt a new binary.
  - src: "./bin/skeind"
    dst: "/usr/local/bin/skeind"
    file_info:
      mode: 0755
      owner: root
      group: root
  # Minimal helper (Step 10 verb list): bootstrap/install/uninstall/
  # start/stop/restart/status/grant-user/set-owner/revoke-user only.
  # The GUI invokes it via pkexec at this exact path.
  - src: "./bin/skein-helper"
    dst: "/usr/libexec/skein-helper"
    file_info:
      mode: 0755
      owner: root
      group: root
  # CLI (diagnostics + system wrappers). The service still points at
  # skeind, never at this binary.
  - src: "./bin/skein"
    dst: "/usr/local/bin/skein"
    file_info:
      mode: 0755
      owner: root
      group: root
  # Vendor unit TEMPLATE (see skein.service header): the live unit
  # is generated by RegisterDaemon at /etc/systemd/system/
  # skein.service, which shadows this file. This file is never
  # enabled or started by postinstall.sh.
  - src: "./build/linux/nfpm/skein.service"
    dst: "/usr/lib/systemd/system/skein.service"
    file_info:
      mode: 0644
      owner: root
      group: root
  # System group for socket access (Agent C L-01).
  - src: "./build/linux/nfpm/sysusers.d/skein.conf"
    dst: "/usr/lib/sysusers.d/skein.conf"
    file_info:
      mode: 0644
      owner: root
      group: root
  # Runtime directory for /run/skein/control.sock.
  - src: "./build/linux/nfpm/tmpfiles.d/skein.conf"
    dst: "/usr/lib/tmpfiles.d/skein.conf"
    file_info:
      mode: 0644
      owner: root
      group: root
  # Polkit policy for the helper's pkexec elevation path (Agent C L-16).
  - src: "./build/linux/nfpm/org.skein.helper.policy"
    dst: "/usr/share/polkit-1/actions/org.skein.helper.policy"
    file_info:
      mode: 0644
      owner: root
      group: root

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  # Step 11 runtime dependencies for the system side. Firewall tools
  # (ufw/firewalld/iptables) are deliberately NOT hard dependencies:
  # the daemon must degrade gracefully when none exists (Agent C
  # L-07) and report "no firewall manager found" in Security status.
  - iproute2
  - acl
  - policykit-1

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
      - iproute
      - acl
      - polkit

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0
      - iproute2
      - acl
      - polkit

# scripts section to ensure desktop database is updated after install
# Step 11: all four lifecycle scripts are wired (preinstall creates
# the skein group; preremove runs helper uninstall BEFORE files are
# removed; postremove reloads systemd and reports kept config).
# AppImage stays GUI-only by design: it cannot install a system
# service, and the AppImage build must fail with a clear message if
# asked to include service installation (see Taskfile create:appimage
# note) rather than shipping a desktop that cannot bootstrap.
scripts:
  preinstall: "./build/linux/nfpm/scripts/preinstall.sh"
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  preremove: "./build/linux/nfpm/scripts/preremove.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
